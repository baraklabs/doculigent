appId: com.doculigent.app
productName: Doculigent
directories:
  output: dist
  buildResources: resources
publish:
  provider: github
  owner: baraklabs
  repo: doculigent
protocols:
  - name: Doculigent
    schemes:
      - doculigent
files:
  - out/**/*
  - package.json
asarUnpack:
  - "**/*.node"
  - node_modules/ffmpeg-static/**
win:
  target:
    - nsis
nsis:
  # oneClick installers skip the entire wizard, including the license page — this has to be
  # off for the accept/decline terms gate below to actually show up.
  oneClick: false
  allowToChangeInstallationDirectory: true
  license: resources/LICENSE_EULA.txt
mac:
  target:
    - target: dmg
      # electron-builder defaults to only the host runner's own arch when this is
      # omitted — GitHub's macos-latest runners are Apple Silicon, so without this,
      # CI would silently produce an arm64-only dmg with no Intel Mac build at all.
      # Built as two separate per-arch dmgs (not a universal binary): keeps native
      # module packaging (keytar, ffmpeg-static) simple, since both already ship
      # separate x64/arm64 prebuilds and a universal merge adds its own failure modes.
      arch:
        - x64
        - arm64
  icon: resources/icon.icns
  category: public.app-category.video
linux:
  target:
    - deb
    - AppImage
  icon: resources/icon.png
  category: AudioVideo
