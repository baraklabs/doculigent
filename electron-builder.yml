appId: com.doculigent.app
productName: Doculigent
directories:
  output: dist
  buildResources: resources
publish:
  provider: github
  owner: baraklabs
  repo: doculigent
protocols:
  - name: Doculigent
    schemes:
      - doculigent
files:
  - out/**/*
  - package.json
asarUnpack:
  - "**/*.node"
  - node_modules/ffmpeg-static/**
extraResources:
  # Compiled ScreenCaptureKit helper (electron/native/mac/ScreenCaptureKitRecorder.swift,
  # built via `npm run build:mac-native`) — macOS's primary native screen-capture backend,
  # see native/screenCapture.ts. Not present if that build step was skipped; the app falls
  # back to the avfoundation-based capture in that case, so this is safe to be absent.
  - from: electron/native/mac/bin
    to: native-bin
    filter:
      - "**/*"
win:
  target:
    - nsis
nsis:
  # oneClick installers skip the entire wizard, including the license page — this has to be
  # off for the accept/decline terms gate below to actually show up.
  oneClick: false
  allowToChangeInstallationDirectory: true
  license: resources/LICENSE-EULA.txt
afterPack: build/afterPack.cjs
mac:
  extendInfo:
    NSCameraUsageDescription: Doculigent uses your camera for the optional camera bubble overlay while recording.
    NSMicrophoneUsageDescription: Doculigent uses your microphone to record voice-over alongside your screen recording.
  target:
    - target: dmg
      arch:
        - universal
  icon: resources/icon.icns
  category: public.app-category.video
linux:
  target:
    - deb
    - AppImage
  icon: resources/icon.png
  category: AudioVideo
