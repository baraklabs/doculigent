appId: com.doculigent.app
productName: Doculigent
directories:
  output: dist
  buildResources: resources
publish:
  provider: github
  owner: baraklabs
  repo: doculigent
protocols:
  - name: Doculigent
    schemes:
      - doculigent
files:
  - out/**/*
  - package.json
asarUnpack:
  - "**/*.node"
  - node_modules/ffmpeg-static/**
win:
  target:
    - nsis
nsis:
  # oneClick installers skip the entire wizard, including the license page — this has to be
  # off for the accept/decline terms gate below to actually show up.
  oneClick: false
  allowToChangeInstallationDirectory: true
  license: resources/LICENSE-EULA.txt
afterPack: build/afterPack.cjs
mac:
  extendInfo:
    NSCameraUsageDescription: Doculigent uses your camera for the optional camera bubble overlay while recording.
    NSMicrophoneUsageDescription: Doculigent uses your microphone to record voice-over alongside your screen recording.
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: resources/icon.icns
  category: public.app-category.video
  extraResources:
    # Compiled ScreenCaptureKit helper (electron/native/mac/ScreenCaptureKitRecorder.swift,
    # built via `npm run build:mac-native`, which must run before packaging — see
    # .github/workflows/release.yml) — macOS's primary native screen-capture backend, see
    # native/screenCapture.ts. A single lipo-merged universal binary works fine inside
    # either arch-specific app bundle below (see the build script's comments). Scoped
    # under mac: (not top-level) since electron/native/mac/bin only ever exists on macOS;
    # a top-level entry would break Windows/Linux packaging, where that directory is never
    # created at all.
    - from: electron/native/mac/bin
      to: native-bin
      filter:
        - "**/*"
        - "!.arch-tmp"
        - "!.arch-tmp/**"
linux:
  target:
    - deb
    - AppImage
  icon: resources/icon.png
  category: AudioVideo
