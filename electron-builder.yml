appId: com.doculigent.app
productName: Doculigent
directories:
  output: dist
  buildResources: resources
publish:
  provider: github
  owner: baraklabs
  repo: doculigent
protocols:
  - name: Doculigent
    schemes:
      - doculigent
files:
  - out/**/*
  - package.json
asarUnpack:
  - "**/*.node"
  - node_modules/ffmpeg-static/**
win:
  target:
    - nsis
  extraResources:
    # Compiled Windows.Graphics.Capture helper (electron/native/windows/capture-helper,
    # built via `npm run build:windows-native`, which must run before packaging) — Quick
    # Recording's native capture path on Windows, see native/screenCapture.ts. Scoped
    # under win: (not top-level) since electron/native/windows/bin only ever exists on
    # Windows builds.
    - from: electron/native/windows/bin
      to: native-bin
      filter:
        - "**/*"
nsis:
  # oneClick installers skip the entire wizard, including the license page — this has to be
  # off for the accept/decline terms gate below to actually show up.
  oneClick: false
  allowToChangeInstallationDirectory: true
  license: resources/LICENSE-EULA.txt
afterPack: build/afterPack.cjs
mac:
  extendInfo:
    NSCameraUsageDescription: Doculigent uses your camera for the optional camera bubble overlay while recording.
    NSMicrophoneUsageDescription: Doculigent uses your microphone to record voice-over alongside your screen recording.
    # Required from macOS 14.2+ for desktopCapturer's system-audio loopback capture (see
    # desktopAudioConstraints in src/services/recording/constraints.ts, used by the
    # Meeting tab's "system sound" source) — without it that capture silently fails on
    # 14.2+. Electron itself only started requiring this key as of the v39 breaking
    # change; harmless to declare on older macOS too.
    NSAudioCaptureUsageDescription: Doculigent captures system audio for the optional "system sound" recording source.
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: resources/icon.icns
  category: public.app-category.video
  extraResources:
    # Compiled ScreenCaptureKit helper (electron/native/mac/ScreenCaptureKitRecorder.swift,
    # built via `npm run build:mac-native`, which must run before packaging — see
    # .github/workflows/release.yml) — macOS's primary native screen-capture backend, see
    # native/screenCapture.ts. A single lipo-merged universal binary works fine inside
    # either arch-specific app bundle below (see the build script's comments). Scoped
    # under mac: (not top-level) since electron/native/mac/bin only ever exists on macOS;
    # a top-level entry would break Windows/Linux packaging, where that directory is never
    # created at all.
    - from: electron/native/mac/bin
      to: native-bin
      filter:
        - "**/*"
        - "!.arch-tmp"
        - "!.arch-tmp/**"
linux:
  target:
    - deb
    - AppImage
  icon: resources/icon.png
  category: AudioVideo
  extraResources:
    # Compiled PipeWire capture helper (electron/native/linux/capture-helper, built via
    # `npm run build:linux-native`) — Quick Recording's native capture path on Linux, see
    # native/screenCapture.ts. UNVERIFIED (see that crate's src/main.rs header comment) —
    # falls back to the existing getDisplayMedia pipeline if missing/broken.
    - from: electron/native/linux/bin
      to: native-bin
      filter:
        - "**/*"
