name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Linux native module build deps
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck
      - name: Write production env
        shell: bash
        run: |
          mkdir -p env
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" > env/.env.production
          echo "VITE_WEB_URL=${{ secrets.VITE_WEB_URL }}" >> env/.env.production

      - name: Build and publish
        if: matrix.os != 'macos-latest'
        run: npm run build -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # macOS x64 and arm64 are built as separate electron-builder invocations.
      # Building both archs in one run leaves native modules (e.g. keytar) rebuilt
      # for only one arch, crashing the other at launch with an architecture mismatch.
      - name: Build and publish (mac x64)
        if: matrix.os == 'macos-latest'
        run: npm run build -- --publish always --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish (mac arm64)
        if: matrix.os == 'macos-latest'
        run: npm run build -- --publish always --arm64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
