name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  # Creates the GitHub release for this tag once, before any OS build starts. Without this,
  # each matrix job below asks electron-builder to publish independently, and electron-builder
  # only reuses an existing release if it can see one — when two jobs both check "does a
  # release exist for this tag?" before either has created it, they each create their own,
  # producing duplicate draft releases with the assets split across them. Creating it here
  # first, in a single job the matrix depends on, removes that race entirely: by the time any
  # OS job starts publishing, exactly one release already exists for every job to reuse.
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Ensure a draft release exists for this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Derived from package.json rather than GITHUB_REF so this also works under
          # workflow_dispatch (no tag ref) and always matches the tag electron-builder itself
          # publishes to (v${version}), regardless of how the workflow was triggered.
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v$VERSION"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists, leaving it as-is."
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --title "$VERSION"
          fi

  release:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Linux native module build deps
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      # Compiles the ScreenCaptureKit helper (see electron/native/mac/ScreenCaptureKitRecorder.swift
      # and native/screenCapture.ts) so it ships in the mac DMG. Without this the packaged
      # app silently falls back to the older avfoundation-based capture, which is exactly
      # the regression this step exists to catch — a release DMG missing the helper is the
      # bug, not an acceptable degrade, so this must run (and succeed) before packaging.
      - name: Build macOS native helper
        if: matrix.os == 'macos-latest'
        run: npm run build:mac-native
      - name: Write production env
        shell: bash
        run: |
          mkdir -p env
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" > env/.env.production
          echo "VITE_WEB_URL=${{ secrets.VITE_WEB_URL }}" >> env/.env.production
          echo "MAIN_VITE_GOOGLE_DRIVE_CLIENT_ID=${{ secrets.MAIN_VITE_GOOGLE_DRIVE_CLIENT_ID }}" >> env/.env.production
          echo "MAIN_VITE_GOOGLE_DRIVE_CLIENT_SECRET=${{ secrets.MAIN_VITE_GOOGLE_DRIVE_CLIENT_SECRET }}" >> env/.env.production

      - name: Build and publish
        run: npm run build -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
