name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Linux native module build deps
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      # Compiles the ScreenCaptureKit helper (see electron/native/mac/ScreenCaptureKitRecorder.swift
      # and native/screenCapture.ts) so it ships in the mac DMG. Without this the packaged
      # app silently falls back to the older avfoundation-based capture, which is exactly
      # the regression this step exists to catch — a release DMG missing the helper is the
      # bug, not an acceptable degrade, so this must run (and succeed) before packaging.
      - name: Build macOS native helper
        if: matrix.os == 'macos-latest'
        run: npm run build:mac-native
      - name: Write production env
        shell: bash
        run: |
          mkdir -p env
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" > env/.env.production
          echo "VITE_WEB_URL=${{ secrets.VITE_WEB_URL }}" >> env/.env.production

      - name: Build and publish
        run: npm run build -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
